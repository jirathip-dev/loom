[package]
name = "loom-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
glam = { version = "0.33.12", default-features = false, features = ["std", "libm"] }
rand_pcg = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.149"
